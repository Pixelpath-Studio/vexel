name: release

# Vexel is in v0.x — a pure-JS preview built on top of `react-native-svg`.
# The Rust core (`crates/vexel-core`), iOS XCFramework, and Android AAR
# pipelines are scaffolded for v1.0 (the Skia + Rust hit-test swap) but
# are NOT part of v0.x releases. See ROADMAP.md "v1.0 — Skia swap".
#
# This workflow currently only validates the JS runtime on a tag push:
#   1. install deps + type-check
#   2. run the JS unit tests
#   3. (optional) publish @pixelpath/vexel to npm if NPM_TOKEN is set
#
# npm publish has historically been a manual step (`npm publish --otp=...`)
# because the maintainer's account uses 2FA. The CI publish path stays
# disabled-by-default to avoid duplicate-publish errors; flip `do_publish`
# to `true` only after configuring an automation token + provenance.
#
# When v1.0 lands, re-enable the rust-binaries → ios-xcframework /
# android-aar / publish-cocoapods / publish-maven jobs below.

on:
  push:
    tags: ['v*']

jobs:
  js-runtime:
    name: js runtime — type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: install workspace deps
        # @pixelpath/vexel has no build step (TS source ships directly) and no
        # runtime npm deps beyond fast-xml-parser. We install at the example
        # app — which has react/react-native/react-native-svg as peer deps —
        # to get a working TS environment.
        working-directory: examples/react-native-mermaid
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: type-check runtime
        working-directory: examples/react-native-mermaid
        run: ./node_modules/.bin/tsc --noEmit
      - name: unit tests — CSS engine
        working-directory: packages/runtime
        run: node --experimental-strip-types src/cssRules.test.ts
      - name: unit tests — painted-area hit test
        working-directory: packages/runtime
        run: node --experimental-strip-types src/hitTest.test.ts

  publish-npm:
    name: publish @pixelpath/vexel to npm
    # Gated. Set `do_publish=true` in repo variables to enable.
    # Default workflow stays in "validation only" mode so accidental
    # tag-pushes don't try to re-publish an already-published version.
    if: vars.do_publish == 'true'
    needs: js-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: publish @pixelpath/vexel
        working-directory: packages/runtime
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

