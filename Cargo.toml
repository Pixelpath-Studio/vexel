[workspace]
resolver = "2"
members = ["crates/trace-core", "crates/trace-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/curo-trace/trace"
rust-version = "1.80"

[workspace.lints.rust]
# `deny` rather than `forbid` so individual crates can opt out for narrow,
# well-justified cases (e.g. POSIX signal hygiene in the CLI). `trace-core`
# itself contains zero unsafe code.
unsafe_code = "deny"
unused_must_use = "deny"
